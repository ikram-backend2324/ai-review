<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}QuizBot{% endblock %}</title>
  {% load static %}
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    :root {
      --bg-void: #050508;
      --bg-deep: #0a0a12;
      --bg-surface: rgba(255,255,255,0.04);
      --bg-surface-hover: rgba(255,255,255,0.07);
      --border: rgba(255,255,255,0.08);
      --border-glow: rgba(120,80,255,0.4);
      --text-primary: #f0eeff;
      --text-secondary: rgba(240,238,255,0.55);
      --text-muted: rgba(240,238,255,0.3);
      --accent-violet: #7c3aed;
      --accent-indigo: #6366f1;
      --accent-cyan: #22d3ee;
      --accent-rose: #f43f5e;
      --accent-amber: #f59e0b;
      --glow-violet: rgba(124,58,237,0.35);
      --glow-cyan: rgba(34,211,238,0.2);
      --radius: 16px;
      --radius-sm: 10px;
      --font-display: 'Syne', sans-serif;
      --font-body: 'DM Sans', sans-serif;
      --transition: 0.22s cubic-bezier(.4,0,.2,1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { font-size: 16px; scroll-behavior: smooth; }

    body {
      font-family: var(--font-body);
      background-color: var(--bg-void);
      color: var(--text-primary);
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
      line-height: 1.6;
    }

    /* ── Ambient background ── */
    body::before {
      content: '';
      position: fixed; inset: 0; z-index: 0;
      background:
        radial-gradient(ellipse 80% 60% at 20% -10%, rgba(99,60,220,0.18) 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 90% 110%, rgba(34,211,238,0.10) 0%, transparent 55%),
        radial-gradient(ellipse 50% 40% at 50% 50%, rgba(124,58,237,0.06) 0%, transparent 70%);
      pointer-events: none;
    }

    /* Subtle noise grain */
    body::after {
      content: '';
      position: fixed; inset: 0; z-index: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='512' height='512' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
      background-size: 256px;
      opacity: 0.4;
      pointer-events: none;
    }

    .page-wrap { position: relative; z-index: 1; min-height: 100vh; }

    /* ── NAV ── */
    nav {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 2rem; height: 64px;
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(20px);
      background: rgba(5,5,8,0.7);
      position: sticky; top: 0; z-index: 100;
    }

    .nav-brand {
      font-family: var(--font-display);
      font-weight: 800; font-size: 1.25rem;
      color: var(--text-primary);
      text-decoration: none;
      display: flex; align-items: center; gap: 0.5rem;
      letter-spacing: -0.02em;
    }

    .nav-brand .brand-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--accent-violet);
      box-shadow: 0 0 12px var(--accent-violet);
      animation: pulse-dot 2s ease-in-out infinite;
    }

    @keyframes pulse-dot {
      0%, 100% { box-shadow: 0 0 8px var(--accent-violet); }
      50% { box-shadow: 0 0 20px var(--accent-violet), 0 0 40px rgba(124,58,237,0.3); }
    }

    .nav-links { display: flex; align-items: center; gap: 0.25rem; }

    .nav-link {
      font-family: var(--font-body); font-weight: 500; font-size: 0.875rem;
      color: var(--text-secondary); text-decoration: none;
      padding: 0.45rem 0.9rem; border-radius: 8px;
      transition: var(--transition);
    }

    .nav-link:hover { color: var(--text-primary); background: var(--bg-surface-hover); }

    .nav-link.active { color: var(--text-primary); background: var(--bg-surface); }

    .nav-btn {
      font-family: var(--font-body); font-weight: 600; font-size: 0.8rem;
      color: var(--text-primary); text-decoration: none;
      padding: 0.45rem 1rem; border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg-surface);
      transition: var(--transition); cursor: pointer;
      display: inline-flex; align-items: center; gap: 0.4rem;
    }

    .nav-btn:hover { border-color: var(--border-glow); background: var(--bg-surface-hover); }

    /* ── Glassmorphism card ── */
    .glass {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      backdrop-filter: blur(20px);
    }

    .glass-strong {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: var(--radius);
      backdrop-filter: blur(30px);
    }

    /* ── Buttons ── */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
      font-family: var(--font-body); font-weight: 600; font-size: 0.9rem;
      padding: 0.7rem 1.5rem; border-radius: var(--radius-sm);
      border: none; cursor: pointer; text-decoration: none;
      transition: var(--transition); position: relative; overflow: hidden;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent-violet), var(--accent-indigo));
      color: #fff;
      box-shadow: 0 4px 20px var(--glow-violet);
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 30px rgba(124,58,237,0.5);
    }

    .btn-primary:active { transform: translateY(0); }

    .btn-outline {
      background: var(--bg-surface);
      color: var(--text-primary);
      border: 1px solid var(--border);
    }

    .btn-outline:hover { border-color: var(--border-glow); background: var(--bg-surface-hover); }

    .btn-danger {
      background: linear-gradient(135deg, #be123c, var(--accent-rose));
      color: #fff;
      box-shadow: 0 4px 20px rgba(244,63,94,0.25);
    }

    .btn-danger:hover { transform: translateY(-1px); box-shadow: 0 8px 30px rgba(244,63,94,0.4); }

    .btn-lg { padding: 0.9rem 2rem; font-size: 1rem; border-radius: var(--radius); }
    .btn-sm { padding: 0.45rem 1rem; font-size: 0.8rem; }

    /* ── Form elements ── */
    .form-group { display: flex; flex-direction: column; gap: 0.45rem; }

    label {
      font-size: 0.8rem; font-weight: 600; letter-spacing: 0.06em;
      text-transform: uppercase; color: var(--text-secondary);
    }

    input[type="text"], input[type="password"], textarea {
      font-family: var(--font-body); font-size: 0.95rem;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-primary);
      padding: 0.75rem 1rem;
      width: 100%;
      transition: var(--transition);
      outline: none;
    }

    input[type="text"]:focus, input[type="password"]:focus, textarea:focus {
      border-color: var(--accent-violet);
      background: rgba(124,58,237,0.06);
      box-shadow: 0 0 0 3px rgba(124,58,237,0.15);
    }

    input::placeholder, textarea::placeholder { color: var(--text-muted); }

    textarea { resize: vertical; min-height: 100px; }

    /* ── Alerts / messages ── */
    .alert {
      padding: 0.75rem 1rem; border-radius: var(--radius-sm);
      font-size: 0.875rem; font-weight: 500;
      display: flex; align-items: center; gap: 0.5rem;
    }

    .alert-error {
      background: rgba(244,63,94,0.1);
      border: 1px solid rgba(244,63,94,0.25);
      color: #fda4af;
    }

    .alert-success {
      background: rgba(34,197,94,0.1);
      border: 1px solid rgba(34,197,94,0.25);
      color: #86efac;
    }

    /* ── Score badge ── */
    .score-badge {
      display: inline-flex; align-items: center; justify-content: center;
      width: 48px; height: 48px; border-radius: 50%;
      font-family: var(--font-display); font-weight: 800; font-size: 0.8rem;
    }

    /* ── Utility ── */
    .text-muted { color: var(--text-muted); }
    .text-secondary { color: var(--text-secondary); }
    .text-accent { color: var(--accent-violet); }
    .text-cyan { color: var(--accent-cyan); }
    .text-rose { color: var(--accent-rose); }
    .text-amber { color: var(--accent-amber); }
    .font-display { font-family: var(--font-display); }

    /* ── Loading Overlay ── */
    #loading-overlay {
      position: fixed; inset: 0; z-index: 9999;
      display: none; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(5,5,8,0.92);
      backdrop-filter: blur(16px);
    }

    #loading-overlay.active { display: flex; }

    .loader-ring {
      width: 72px; height: 72px; border-radius: 50%;
      border: 3px solid rgba(124,58,237,0.15);
      border-top-color: var(--accent-violet);
      border-right-color: var(--accent-cyan);
      animation: spin 1.1s cubic-bezier(.6,.2,.4,.8) infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .loader-text {
      margin-top: 1.5rem;
      font-family: var(--font-display); font-weight: 600;
      font-size: 0.95rem; letter-spacing: 0.05em;
      color: var(--text-secondary);
      animation: loader-fade 1.5s ease-in-out infinite;
    }

    @keyframes loader-fade {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }

    .loader-dots { display: flex; gap: 6px; margin-top: 0.75rem; }

    .loader-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--accent-violet);
      animation: dot-bounce 1.4s ease-in-out infinite;
    }

    .loader-dot:nth-child(2) { animation-delay: 0.2s; background: var(--accent-indigo); }
    .loader-dot:nth-child(3) { animation-delay: 0.4s; background: var(--accent-cyan); }

    @keyframes dot-bounce {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
      40% { transform: scale(1.2); opacity: 1; }
    }

    /* ── Page fade-in ── */
    .page-wrap { animation: page-in 0.4s ease-out; }

    @keyframes page-in {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }

    @media (max-width: 640px) {
      nav { padding: 0 1rem; }
      .nav-link { display: none; }
    }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>

<!-- Loading Overlay -->
<div id="loading-overlay">
  <div class="loader-ring"></div>
  <p class="loader-text" id="loader-message">AI is thinking…</p>
  <div class="loader-dots">
    <div class="loader-dot"></div>
    <div class="loader-dot"></div>
    <div class="loader-dot"></div>
  </div>
</div>

<div class="page-wrap">
  {% if user.is_authenticated %}
  <nav>
    <a href="{% url 'home' %}" class="nav-brand">
      <div class="brand-dot"></div>
      QuizBot
    </a>
    <div class="nav-links">
      <a href="{% url 'home' %}" class="nav-link {% if request.resolver_match.url_name == 'home' %}active{% endif %}">
        <i class="fa-solid fa-house"></i>&nbsp; Home
      </a>
      <a href="{% url 'history' %}" class="nav-link {% if request.resolver_match.url_name == 'history' %}active{% endif %}">
        <i class="fa-solid fa-clock-rotate-left"></i>&nbsp; History
      </a>
      <a href="{% url 'logout' %}" class="nav-btn">
        <i class="fa-solid fa-right-from-bracket"></i> Logout
      </a>
    </div>
  </nav>
  {% endif %}

  {% block content %}{% endblock %}
</div>

<script>
  function showLoading(msg) {
    document.getElementById('loader-message').textContent = msg || 'AI is thinking…';
    document.getElementById('loading-overlay').classList.add('active');
  }
  function hideLoading() {
    document.getElementById('loading-overlay').classList.remove('active');
  }
</script>
{% block extra_js %}{% endblock %}
</body>
</html>
